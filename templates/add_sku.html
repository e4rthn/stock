{% extends "base.html" %}

{% block title %}เพิ่ม SKU ใหม่{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-light"> {# Use light background #}
                <h1 class="h3 mb-0">เพิ่ม SKU ใหม่</h1>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('add_sku') }}">
                    <div class="mb-3">
                        <label for="sku" class="form-label fw-bold">SKU Code:<span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="sku" name="sku" value="{{ sku or '' }}" required style="text-transform:uppercase"> {# Force uppercase via style #}
                        <div class="form-text">รหัสสินค้าที่ไม่ซ้ำกัน (เช่น PORK01)</div>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">ชื่อสินค้า:<span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label fw-bold">ประเภท:<span class="text-danger">*</span></label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="" {% if not selected_category %}selected{% endif %} disabled>-- กรุณาเลือก --</option>
                            {% for category_name in categories %}
                            <option value="{{ category_name }}" {% if selected_category == category_name %}selected{% endif %}>
                                {{ category_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                         <label for="shelf_life_days" class="form-label fw-bold">อายุสินค้า (วัน):<span class="text-danger">*</span></label>
                         <input type="number" class="form-control" id="shelf_life_days" name="shelf_life_days"
                                value="{{ shelf_life or '' }}" min="1" required>
                         <div class="form-text">จำนวนวันนับจากวันที่รับเข้า (ต้องมากกว่า 0)</div>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('list_skus') }}" class="btn btn-secondary me-md-2">ยกเลิก</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>เพิ่ม SKU</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
